<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shandar Pethawala - Authentic Indian Cuisine</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 1rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.5rem;
        }
        nav ul {
            list-style: none;
            display: flex;
        }
        nav ul li {
            margin-left: 2rem;
        }
        nav ul li a:hover {
            color: #ffcc00;
        }
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        /* Hero Section */
        .hero {
            height: 100vh;
            background: url('https://via.placeholder.com/1920x1080?text=Shandar+Pethawala+Hero+Image') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .hero h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .btn {
            background: #ffcc00;
            color: #333;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #e6b800;
        }
        /* Sections */
        section {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .about, .menu, .gallery, .contact {
            margin-bottom: 4rem;
        }
        h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            color: #333;
        }
        .about p {
            text-align: center;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .menu-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .menu-item:hover {
            transform: translateY(-5px);
        }
        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .menu-item h3 {
            padding: 1rem;
            font-size: 1.5rem;
        }
        .menu-item p {
            padding: 0 1rem 1rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .contact form {
            max-width: 500px;
            margin: 0 auto;
        }
        .contact input, .contact textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact button {
            width: 100%;
            padding: 0.75rem;
            background: #ffcc00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .contact button:hover {
            background: #e6b800;
        }
        /* Footer */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        /* Responsive */
        @media (max-width: 768px) {
            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.9);
            }
            nav ul.show {
                display: flex;
            }
            nav ul li {
                margin: 1rem 0;
            }
            .menu-toggle {
                display: block;
            }
            .hero h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Shandar Pethawala</h1>
        <nav>
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>
            <ul id="nav-menu">
                <li><a href="#about">About</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Welcome to Shandar Pethawala</h2>
            <p>Experience the flavors of authentic Indian street food and fine dining.</p>
            <a href="#menu" class="btn">Explore Menu</a>
        </div>
    </section>

    <section id="about" class="about">
        <h2>About Us</h2>
        <p>Shandar Pethawala is a culinary haven
